<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>进入管理后台</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-elevated: #1a1a1a;
      --bg-card: #141414;
      --text: #f5f5f5;
      --text-muted: #888;
      --text-dim: #666;
      --accent: #fff;
      --border: #2a2a2a;
      --border-light: #333;
      --error: #ff4444;
      --success: #00c853;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }
    /* 背景装饰 */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }
    .login-container {
      width: min(92vw, 460px);
      position: relative;
      z-index: 1;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 56px 48px;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }
    /* Logo区域 */
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 48px;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      border: 1.5px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--accent);
      position: relative;
    }
    .brand-icon::after {
      content: '';
      position: absolute;
      inset: -1px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    .brand-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    /* 标题 */
    h1 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: 0;
    }
    .subtitle {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 40px;
      font-weight: 300;
    }
    /* 表单 */
    .form-group {
      margin-bottom: 32px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .input-wrapper {
      position: relative;
    }
    input {
      width: 100%;
      padding: 18px 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      color: var(--text);
      outline: none;
      transition: all 0.25s ease;
    }
    input:hover {
      border-color: var(--border-light);
    }
    input:focus {
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.02);
    }
    input::placeholder {
      color: var(--text-dim);
    }
    .input-line {
      position: absolute;
      bottom: -1px;
      left: 50%;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    input:focus ~ .input-line {
      width: 100%;
    }
    /* 按钮 */
    .btn-primary {
      width: 100%;
      padding: 20px 24px;
      background: var(--text);
      border: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0;
      color: var(--bg);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    .btn-primary:hover::before {
      left: 100%;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(255,255,255,0.1);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    /* 消息 */
    .message {
      margin-top: 24px;
      padding: 16px 20px;
      font-size: 14px;
      font-weight: 500;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 2px solid transparent;
    }
    .message::before {
      font-size: 16px;
    }
    .message.error {
      background: rgba(255,68,68,0.08);
      color: var(--error);
      border-left-color: var(--error);
    }
    .message.error::before { content: '✕'; }
    .message.success {
      background: rgba(0,200,83,0.08);
      color: var(--success);
      border-left-color: var(--success);
    }
    .message.success::before { content: '✓'; }
    /* 装饰元素 */
    .corner {
      position: absolute;
      width: 8px;
      height: 8px;
      border: 1px solid var(--border-light);
    }
    .corner-tl { top: -4px; left: -4px; border-right: none; border-bottom: none; }
    .corner-tr { top: -4px; right: -4px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: -4px; left: -4px; border-right: none; border-top: none; }
    .corner-br { bottom: -4px; right: -4px; border-left: none; border-top: none; }

    @media (max-width: 480px) {
      .card { padding: 40px 28px; }
      h1 { font-size: 28px; }
      .brand { margin-bottom: 36px; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="login-container">
    <div class="card">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <div class="brand">
        <div class="brand-icon">P</div>
        <span class="brand-text">Proxy Admin</span>
      </div>

      <h1>欢迎回来</h1>
      <p class="subtitle">请输入管理口令进入配置管理页面。<br>验证成功后将在浏览器中建立安全会话。</p>

      <div class="form-group">
        <span class="form-label">管理口令</span>
        <div class="input-wrapper">
          <input id="token" type="password" placeholder="输入您的管理口令" autofocus autocomplete="off" />
          <div class="input-line"></div>
        </div>
      </div>

      <button class="btn-primary" id="submit">进入后台</button>

      <div class="message" id="msg"></div>
    </div>
  </div>

  <script>
    const token = document.getElementById('token');
    const msg = document.getElementById('msg');
    const submit = document.getElementById('submit');

    function setError(text) {
      msg.className = 'message error';
      msg.textContent = text;
    }
    function setSuccess(text) {
      msg.className = 'message success';
      msg.textContent = text;
    }

    async function doLogin() {
      const val = token.value.trim();
      if (!val) {
        setError('请输入管理口令');
        token.focus();
        return;
      }
      submit.disabled = true;
      setSuccess('正在验证身份...');
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: val })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setError(data.message || '口令验证失败');
          submit.disabled = false;
          token.focus();
          return;
        }
        setSuccess('验证成功，正在进入...');
        setTimeout(() => window.location.href = '/admin', 300);
      } catch (e) {
        setError('网络连接异常，请重试');
        submit.disabled = false;
      }
    }

    submit.addEventListener('click', doLogin);
    token.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
