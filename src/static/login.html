<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理登录</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg,#0f172a,#1e293b); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .card { width:min(92vw,420px); background:#fff; border-radius:20px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    h1 { margin:0 0 8px; font-size:28px; }
    p { color:#64748b; line-height:1.7; }
    input { width:100%; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:12px; padding:14px; font-size:16px; margin:16px 0; }
    button { width:100%; border:none; border-radius:12px; padding:14px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer; }
    .msg { margin-top:14px; font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>进入管理后台</h1>
    <p>请先输入管理口令。认证成功后，浏览器会建立会话，再进入配置管理页面。</p>
    <input id="token" type="password" placeholder="请输入管理口令" autofocus />
    <button id="submit">登录</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const token = document.getElementById('token');
    const msg = document.getElementById('msg');
    async function submit() {
      msg.textContent = '正在登录...';
      msg.style.color = '#0f766e';
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token.value })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        msg.textContent = data.message || '登录失败';
        msg.style.color = '#dc2626';
        return;
      }
      window.location.href = '/admin';
    }
    document.getElementById('submit').addEventListener('click', submit);
    token.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  </script>
</body>
</html>
